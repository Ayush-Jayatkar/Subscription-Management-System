services:
  postgres:
    image: postgres:17-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brightloop
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_dev
    ports:
      - "5432:5432"
    volumes:
      - brightloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brightloop_pgdata:
